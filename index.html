<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA TECH PVT. LTD.</title>
  <style>
    /* GENERAL STYLING */
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #000000 70%, #00171f 100%);
      color: #00eaff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    h1 {
      color: #00eaff;
      font-size: 2.5rem;
      text-align: center;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    /* CENTER LOGO */
    .center-logo {
      position: relative;
      width: 130px;
      height: 130px;
      animation: float 4s ease-in-out infinite;
    }

    .center-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 15px #00eaff);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ORBIT CONTAINER */
    .orbit {
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      animation: rotate 22s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* PRODUCT ICONS */
    .orbit-item {
      position: absolute;
      text-align: center;
      color: #00eaff;
      transition: 0.3s;
    }

    .orbit-item img {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      filter: drop-shadow(0 0 10px #00eaffaa);
      transition: 0.3s;
      cursor: pointer;
    }

    .orbit-item span {
      display: block;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .orbit-item:hover img {
      transform: scale(1.15);
      filter: drop-shadow(0 0 25px #00eaff);
    }

    /* POSITIONING ITEMS IN ORBIT */
    .item1 { transform: rotate(0deg) translate(260px) rotate(0deg); }
    .item2 { transform: rotate(72deg) translate(260px) rotate(-72deg); }
    .item3 { transform: rotate(144deg) translate(260px) rotate(-144deg); }
    .item4 { transform: rotate(216deg) translate(260px) rotate(-216deg); }
    .item5 { transform: rotate(288deg) translate(260px) rotate(-288deg); }

    /* CLICK POPUP */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0, 20, 25, 0.95);
      padding: 40px 60px;
      border-radius: 20px;
      color: #00eaff;
      box-shadow: 0 0 25px #00eaff;
      text-align: center;
      transition: transform 0.4s ease;
      z-index: 10;
    }

    .popup.active {
      transform: translate(-50%, -50%) scale(1);
    }

    .popup button {
      background: none;
      border: 1px solid #00eaff;
      color: #00eaff;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .popup button:hover {
      background: #00eaff;
      color: #000;
    }

  </style>
</head>
<body>

  <!-- Center Logo -->
  <div class="center-logo">
    <img src="logo.png" alt="NEXA TECH Logo">
  </div>

  <!-- Orbiting Items -->
  <div class="orbit">
    <div class="orbit-item item1" onclick="showPopup('NexaVerse – Smart AI Glasses with Augmented Reality')">
      <img src="NexaVERSE.png" alt="NexaVerse">
      <span>NexaVerse</span>
    </div>
    <div class="orbit-item item2" onclick="showPopup('NexaHome – Smart Home Ecosystem')">
      <img src="NexaHOME.png" alt="NexaHome">
      <span>NexaHome</span>
    </div>
    <div class="orbit-item item3" onclick="showPopup('NexaCell – Adaptive Graphene Powerbank')">
      <img src="NexaCELL.png" alt="NexaCell">
      <span>NexaCell</span>
    </div>
    <div class="orbit-item item4" onclick="showPopup('NexaBot – AI Assistant Robot')">
      <img src="NexaBOT.png" alt="NexaBot">
      <span>NexaBot</span>
    </div>
    <div class="orbit-item item5" onclick="showPopup('NexaBuds – AI Powered Smart Earbuds')">
      <img src="NexaBUDS.png" alt="NexaBuds">
      <span>NexaBuds</span>
    </div>
  </div>

  <!-- Popup -->
  <div id="popup" class="popup">
    <h2 id="popup-title">Product Info</h2>
    <p>Coming soon on NEXA TECH!</p>
    <button onclick="closePopup()">Close</button>
  </div>

  <h1>Welcome to NEXA TECH</h1>

  <script>
    function showPopup(product) {
      document.getElementById('popup-title').innerText = product;
      document.getElementById('popup').classList.add('active');
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }
  </script>
</body>
</html>
