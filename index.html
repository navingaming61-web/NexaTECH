<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXA TECH PVT. LTD.</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #050505, #0b0b0b, #000);
      color: white;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(6px);
      padding: 15px 30px;
      box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
    }

    img.logo {
      width: 60px;
      cursor: pointer;
      border-radius: 10px;
    }

    .menu-icon {
      font-size: 28px;
      cursor: pointer;
      display: block;
      color: #00d9ff;
      transition: 0.3s;
    }

    .menu-icon:hover {
      transform: scale(1.1);
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      right: -260px;
      top: 0;
      width: 260px;
      height: 100%;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(8px);
      box-shadow: -5px 0 15px rgba(0, 255, 255, 0.1);
      transition: right 0.4s ease;
      padding-top: 60px;
      z-index: 999;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar button, .sidebar a {
      display: block;
      width: 100%;
      padding: 14px 25px;
      border: none;
      background: none;
      color: #fff;
      font-size: 18px;
      text-align: left;
      cursor: pointer;
      transition: 0.3s;
    }

    .sidebar button:hover, .sidebar a:hover {
      background: rgba(0, 255, 255, 0.1);
      color: #00d9ff;
    }

    .dropdown-container {
      display: none;
      padding-left: 20px;
      background: rgba(0, 0, 0, 0.4);
    }

    .dropdown-btn::after {
      content: "▼";
      float: right;
      transition: 0.3s;
    }

    .dropdown-btn.active::after {
      transform: rotate(180deg);
    }

    /* Main content */
    main {
      text-align: center;
      padding: 80px 30px;
    }

    main h1 {
      font-size: 38px;
      color: #00d9ff;
      letter-spacing: 2px;
    }

    main h3 {
      font-size: 20px;
      font-weight: 400;
      margin-top: 15px;
      color: #bfbfbf;
    }

    main p {
      margin-top: 25px;
      color: #c0c0c0;
      line-height: 1.6;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="NEXA TECH Logo" class="logo" />
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
  </header>

  <div id="sidebar" class="sidebar">
    <button class="dropdown-btn">About Us</button>
    <div class="dropdown-container">
      <a href="#">📍 Address</a>
      <a href="#">🌍 Our Vision</a>
      <a href="#">🚀 Mission</a>
      <a href="#">💡 Our Journey</a>
    </div>
  </div>

  <main>
    <h1>Welcome to NEXA TECH</h1>
    <h3>NEXA TECH PVT. LTD. 🚀 Future-Driven. Innovation-Led.</h3>
    <p>
      Revolutionizing technology through Artificial Intelligence, Smart Devices,
      and futuristic designs for a better tomorrow.
    </p>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    const dropdown = document.querySelector(".dropdown-btn");
    dropdown.addEventListener("click", function () {
      this.classList.toggle("active");
      const content = this.nextElementSibling;
      content.style.display = content.style.display === "block" ? "none" : "block";
    });
  </script>

</body>
</html>
