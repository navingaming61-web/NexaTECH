<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXA TECH PVT. LTD.</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0c0c0c;
      color: white;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      padding: 15px 30px;
    }

    header h1 {
      font-size: 26px;
      letter-spacing: 1px;
    }

    img.logo {
      width: 60px;
      cursor: pointer;
    }

    /* Hamburger Icon */
    .menu-icon {
      font-size: 28px;
      cursor: pointer;
      display: block;
    }

    /* Sidebar Menu */
    .sidebar {
      position: fixed;
      right: -250px;
      top: 0;
      width: 250px;
      height: 100%;
      background: #1b1b1b;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.6);
      transition: right 0.3s ease;
      padding-top: 60px;
      z-index: 999;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar a {
      display: block;
      padding: 12px 25px;
      text-decoration: none;
      color: white;
      font-size: 18px;
    }

    .sidebar a:hover {
      background: #292929;
    }

    /* Dropdown */
    .dropdown-btn {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      outline: none;
      color: white;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .dropdown-container {
      display: none;
      background-color: #2a2a2a;
      padding-left: 20px;
    }

    .dropdown-container a {
      font-size: 16px;
      padding: 8px 25px;
    }

    .dropdown-btn::after {
      content: "▼";
      float: right;
      margin-left: 5px;
    }

    .dropdown-btn.active::after {
      content: "▲";
    }

    /* Main Content */
    main {
      padding: 40px;
      text-align: center;
    }

    main h2 {
      color: #00d9ff;
      font-size: 32px;
    }

    main p {
      color: #ccc;
      max-width: 700px;
      margin: 20px auto;
      line-height: 1.6;
    }

  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="NEXA TECH Logo" class="logo" />
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
  </header>

  <div id="sidebar" class="sidebar">
    <button class="dropdown-btn">About Us</button>
    <div class="dropdown-container">
      <a href="#">Our Address</a>
      <a href="#">Vision</a>
      <a href="#">Mission</a>
      <a href="#">Our Journey</a>
    </div>
  </div>

  <main>
    <h2>Welcome to NEXA TECH</h2>
    <p>
      NEXA TECH PVT. LTD. 🚀 Future-Driven. Innovation-Led.<br><br>
      Revolutionizing technology through Artificial Intelligence, Smart Devices,
      and futuristic designs for a better tomorrow.
    </p>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    let dropdown = document.querySelector(".dropdown-btn");
    dropdown.addEventListener("click", function () {
      this.classList.toggle("active");
      let dropdownContent = this.nextElementSibling;
      dropdownContent.style.display =
        dropdownContent.style.display === "block" ? "none" : "block";
    });
  </script>
</body>
</html>
