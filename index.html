<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aviora Tech Pvt. Ltd.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; scroll-behavior: smooth; }
    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at 20% 10%, #071023 0%, #020203 45%, #000 100%);
      color: #e6f7fb;
      overflow-x: hidden;
    }
    .hero {
      height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
    }
    .logo { width: 220px; animation: floaty 3s ease-in-out infinite; cursor: pointer; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    .company-name { margin-top: 10px; color: #bff8ff; font-size: 28px; font-weight: 700; letter-spacing: 1.4px; }
    .subtitle { margin-top: 10px; color: #c9f1f6; font-size: 15px; opacity: 0.85; max-width: 700px; }

    .products {
      padding: 100px 20px;
      text-align: center;
    }
    .products h2 { font-size: 2rem; color: #00eaff; margin-bottom: 50px; text-shadow: 0 0 10px #00eaff; }
    .product-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 40px;
    }
    .product-card {
      width: 200px; text-align: center;
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.15);
      border-radius: 15px; padding: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .product-card:hover { transform: scale(1.07); box-shadow: 0 0 20px rgba(0,255,255,0.25); }
    .product-card img { width: 100%; border-radius: 10px; }
    .product-card h3 { margin-top: 10px; color: #bffcff; font-size: 18px; }

    .product-info {
      padding: 80px 20px;
      text-align: center;
      display: none;
    }
    .product-info.active { display: block; }
    .product-info h2 { color: #00eaff; font-size: 2rem; margin-bottom: 20px; text-shadow: 0 0 10px #00eaff; }
    .product-info img { width: 260px; margin: 20px 0; border-radius: 15px; box-shadow: 0 0 30px rgba(0,255,255,0.1); }
    .product-info p { max-width: 700px; margin: 0 auto; line-height: 1.7; color: #c9f1f6; }

    footer { text-align: center; padding: 25px; background: #010a10; border-top: 1px solid rgba(0,255,255,0.15); color: #00f0ff; font-size: 14px; }
  </style>
</head>

<body>
  <main class="hero" id="mainPage">
    <div class="logo-wrap">
      <img src="logo.png" alt="Aviora Tech Logo" class="logo" />
      <div class="company-name">Aviora Tech Pvt. Ltd.</div>
      <div class="subtitle">AI • Robotics • Smart Devices — The Future, Reinvented</div>
    </div>
  </main>

  <section class="products" id="productSection">
    <h2>Our Products</h2>
    <div class="product-grid">
      <div class="product-card" data-product="AvioraBuds"><img src="NexaBUDS.png" alt=""><h3>AvioraBuds</h3></div>
      <div class="product-card" data-product="AvioraVerse"><img src="NexaVERSE.png" alt=""><h3>AvioraVerse</h3></div>
      <div class="product-card" data-product="AvioraHome"><img src="NexaHOME.png" alt=""><h3>AvioraHome</h3></div>
      <div class="product-card" data-product="AvioraCell"><img src="NexaCELL.png" alt=""><h3>AvioraCell</h3></div>
      <div class="product-card" data-product="AvioraBot"><img src="NexaBOT.png" alt=""><h3>AvioraBot</h3></div>
    </div>
  </section>

  <section class="product-info" id="productInfo">
    <h2 id="productTitle"></h2>
    <img id="productImage" src="" alt="">
    <p id="productDescription"></p>
  </section>

  <footer>© 2025 Aviora Tech Pvt. Ltd. — All Rights Reserved.</footer>

  <script>
    const productCards = document.querySelectorAll(".product-card");
    const mainPage = document.getElementById("mainPage");
    const productSection = document.getElementById("productSection");
    const productInfo = document.getElementById("productInfo");

    const productData = {
      AvioraBuds: {
        img: "NexaBUDS.png",
        title: "AvioraBuds",
        desc: "Experience crystal-clear sound and intelligent noise cancellation with AvioraBuds. Expected Price: ₹8,499 | Warranty: 1 Year"
      },
      AvioraVerse: {
        img: "NexaVERSE.png",
        title: "AvioraVerse",
        desc: "Step into mixed reality with AvioraVerse smart AR glasses. Expected Price: ₹29,999 | Warranty: 2 Years"
      },
      AvioraHome: {
        img: "NexaHOME.png",
        title: "AvioraHome",
        desc: "Smart home ecosystem with AI voice control and automation. Expected Price: ₹14,999 | Warranty: 1 Year"
      },
      AvioraCell: {
        img: "NexaCELL.png",
        title: "AvioraCell",
        desc: "A futuristic AI-powered smartphone built for next-gen performance. Expected Price: ₹79,999 | Warranty: 1.5 Years"
      },
      AvioraBot: {
        img: "NexaBOT.png",
        title: "AvioraBot",
        desc: "Your personal home robot assistant. Helps you organize, interact, and live smarter. Expected Price: ₹1,49,999 | Warranty: 3 Years"
      }
    };

    productCards.forEach(card => {
      card.addEventListener("click", () => {
        const key = card.getAttribute("data-product");
        const item = productData[key];
        mainPage.style.display = "none";
        productSection.style.display = "none";
        productInfo.classList.add("active");
        document.getElementById("productTitle").textContent = item.title;
        document.getElementById("productImage").src = item.img;
        document.getElementById("productDescription").textContent = item.desc;
        window.scrollTo(0, 0);
      });
    });
  </script>
</body>
</html>
